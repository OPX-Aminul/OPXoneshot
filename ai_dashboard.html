:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--bg4:#222240;--text:#e0e0e0;--accent:#00ff41;--accent2:#00cc33;--warn:#ff6b35;--danger:#ff3333;--success:#00ff41;--dim:#666;--border:#2a2a4a}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:8px}

.header{padding:20px 30px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:2px solid var(--accent);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:-100%;width:200%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,255,65,0.03),transparent);animation:headerSweep 8s infinite}
@keyframes headerSweep{0%{transform:translateX(-50%)}100%{transform:translateX(50%)}}
.header h1{font-size:24px;color:var(--accent);text-shadow:0 0 20px rgba(0,255,65,0.3);letter-spacing:4px;animation:textGlow 2s ease-in-out infinite alternate}
@keyframes textGlow{from{text-shadow:0 0 20px rgba(0,255,65,0.3)}to{text-shadow:0 0 40px rgba(0,255,65,0.6),0 0 80px rgba(0,255,65,0.2)}}
.header .subtitle{font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:2px}
.tabs{display:flex;background:var(--bg2);border-bottom:2px solid var(--border);overflow-x:auto;flex-wrap:nowrap}
.tab{padding:12px 24px;cursor:pointer;color:var(--dim);font-size:13px;letter-spacing:1px;border-bottom:3px solid transparent;transition:all 0.3s;white-space:nowrap;user-select:none}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg3)}
.tab-content{display:none;padding:20px 30px;animation:fadeIn 0.3s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:16px}
.card-title{font-size:14px;color:var(--accent);margin-bottom:12px;letter-spacing:1px;border-bottom:1px solid var(--border);padding-bottom:8px}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.metric-card{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;transition:transform 0.2s,border-color 0.2s}
.metric-card:hover{transform:translateY(-2px);border-color:var(--accent2)}
.metric-card .value{font-size:28px;font-weight:bold;color:var(--accent);margin:8px 0}
.metric-card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.status-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;animation:pulse 2s infinite}
.status-dot.green{background:var(--success);box-shadow:0 0 10px var(--success)}
.status-dot.yellow{background:#ffcc00;box-shadow:0 0 10px #ffcc00}
.status-dot.red{background:var(--danger);box-shadow:0 0 10px var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
canvas{display:block;max-width:100%}
.chart-container{position:relative;margin:12px 0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}
input[type=range]{-webkit-appearance:none;background:var(--bg4);height:6px;border-radius:3px;outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 6px var(--accent)}
select,button{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-family:inherit;font-size:12px;cursor:pointer;transition:all 0.2s}
select:hover,button:hover{border-color:var(--accent2)}
button.primary{background:var(--accent2);color:#000;border-color:var(--accent);font-weight:bold}
button.primary:hover{background:var(--accent);box-shadow:0 0 15px rgba(0,255,65,0.3)}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.danger:hover{background:#ff5555}
.toggle-wrap{display:flex;align-items:center;gap:8px;font-size:12px}
.toggle{position:relative;width:44px;height:22px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:var(--bg4);border-radius:11px;transition:0.3s}
.toggle .slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:#666;border-radius:50%;transition:0.3s}
.toggle input:checked+.slider{background:var(--accent2)}
.toggle input:checked+.slider::before{transform:translateX(22px);background:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--accent);background:var(--bg3);position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{color:var(--accent2)}
tr:hover{background:rgba(0,255,65,0.03)}
.table-wrap{max-height:400px;overflow:auto;border:1px solid var(--border);border-radius:6px}
.log-console{background:#000;color:var(--accent);font-size:11px;padding:12px;border-radius:6px;max-height:300px;overflow-y:auto;border:1px solid var(--border);font-family:'Courier New',monospace}
.log-line{margin:2px 0;opacity:0;animation:logFade 0.3s forwards}
@keyframes logFade{to{opacity:1}}
.log-line.warn{color:var(--warn)}
.log-line.err{color:var(--danger)}
.log-line.info{color:#00ccff}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-size:11px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-color{width:12px;height:3px;border-radius:2px}
.slider-range{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px}
.empty{color:var(--dim);font-style:italic;text-align:center;padding:20px}

<script>
if(!CanvasRenderingContext2D.prototype.roundRect){
CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
if(typeof r==='number')r=[r,r,r,r];
this.beginPath();this.moveTo(x+r[0],y);
this.lineTo(x+w-r[1],y);this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
this.lineTo(x+w,y+h-r[2]);this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
this.lineTo(x+r[3],y+h);this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
this.lineTo(x,y+r[0]);this.quadraticCurveTo(x,y,x+r[0],y);
this.closePath();return this;
};
}
(function(){
const A={accent:'#00ff41',accent2:'#00cc33',warn:'#ff6b35',danger:'#ff3333',smart:'#00ff41',adaptive:'#00ccff',heuristic:'#ff6b35',bg:'#0a0a0f',bg2:'#12121a',bg3:'#1a1a2e',text:'#e0e0e0',dim:'#666',border:'#2a2a4a'};

function $(s,p){return(p||document).querySelector(s)}
function $$(s,p){return(p||document).querySelectorAll(s)}

$$('.tab').forEach(t=>{
t.addEventListener('click',function(){
$$('.tab').forEach(x=>x.classList.remove('active'));
$$('.tab-content').forEach(x=>x.classList.remove('active'));
this.classList.add('active');
$('#tab-'+this.dataset.tab).classList.add('active');
if(this.dataset.tab==='training')drawTrainingCharts();
if(this.dataset.tab==='qtable')drawQTable();
if(this.dataset.tab==='features')drawFeatures();
if(this.dataset.tab==='scenarios')drawScenarios();
if(this.dataset.tab==='overview')drawOverview();
});
});

function createCanvas(id,w,h){
const c=document.createElement('canvas');
c.id=id;c.width=w||900;c.height=h||350;
c.style.width='100%';c.style.height='auto';
return c;
}

function drawLineChart(canvas,datasets,opts){
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const pad={t:40,r:20,b:50,l:60};
const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
ctx.clearRect(0,0,W,H);
ctx.fillStyle=A.bg2;ctx.fillRect(0,0,W,H);
let allVals=[];
datasets.forEach(d=>allVals=allVals.concat(d.data));
if(!allVals.length)return;
let mn=opts.min!==undefined?opts.min:Math.min(...allVals);
let mx=opts.max!==undefined?opts.max:Math.max(...allVals);
if(mn===mx){mn-=1;mx+=1}
const range=mx-mn;
const maxLen=Math.max(...datasets.map(d=>d.data.length));

ctx.strokeStyle=A.border;ctx.lineWidth=0.5;
const yTicks=5;
for(let i=0;i<=yTicks;i++){
const y=pad.t+ch-(i/yTicks)*ch;
ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
ctx.fillStyle=A.dim;ctx.font='10px monospace';ctx.textAlign='right';
ctx.fillText((mn+i/yTicks*range).toFixed(2),pad.l-8,y+3);
}
const xTicks=Math.min(maxLen,10);
for(let i=0;i<=xTicks;i++){
const x=pad.l+(i/xTicks)*cw;
ctx.fillStyle=A.dim;ctx.font='10px monospace';ctx.textAlign='center';
ctx.fillText(Math.round(i/xTicks*maxLen),x,H-pad.b+18);
}
if(opts.xLabel){ctx.fillStyle=A.dim;ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText(opts.xLabel,pad.l+cw/2,H-8)}
if(opts.yLabel){ctx.save();ctx.fillStyle=A.dim;ctx.font='11px monospace';ctx.translate(14,pad.t+ch/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText(opts.yLabel,0,0);ctx.restore()}

if(opts.vLines){
opts.vLines.forEach(v=>{
const x=pad.l+(v.pos/maxLen)*cw;
ctx.strokeStyle=v.color||'rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ch);ctx.stroke();
ctx.setLineDash([]);
if(v.label){ctx.fillStyle=v.color||A.dim;ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(v.label,x,pad.t-5)}
});
}

datasets.forEach(ds=>{
if(!ds.data.length)return;
ctx.strokeStyle=ds.color;ctx.lineWidth=ds.lineWidth||1.5;
if(ds.dash)ctx.setLineDash(ds.dash);else ctx.setLineDash([]);
ctx.beginPath();
ds.data.forEach((v,i)=>{
const x=pad.l+(i/(maxLen-1||1))*cw;
const y=pad.t+ch-(((v-mn)/range)*ch);
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
});
ctx.stroke();
ctx.setLineDash([]);
});

if(opts.legend){
let lx=pad.l+10;
opts.legend.forEach(l=>{
ctx.fillStyle=l.color;ctx.fillRect(lx,10,20,3);
ctx.fillStyle=A.text;ctx.font='10px monospace';ctx.textAlign='left';

lx+=ctx.measureText(l.label).width+40;
});

function drawBarChart(canvas,data,opts){
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const pad={t:40,r:20,b:60,l:60};
const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
ctx.clearRect(0,0,W,H);ctx.fillStyle=A.bg2;ctx.fillRect(0,0,W,H);
const mx=Math.max(...data.map(d=>Math.max(...d.values)))*1.15||1;
const groupW=cw/data.length;
const barW=Math.min(groupW*0.7/data[0].values.length,40);
const barGap=2;

data.forEach((d,gi)=>{
const gx=pad.l+gi*groupW+groupW/2;
d.values.forEach((v,bi)=>{
const bh=(v/mx)*ch;
const x=gx-(d.values.length*(barW+barGap))/2+bi*(barW+barGap);
const y=pad.t+ch-bh;
const grad=ctx.createLinearGradient(x,y,x,pad.t+ch);
grad.addColorStop(0,d.colors[bi]);grad.addColorStop(1,A.bg3);
ctx.fillStyle=grad;
ctx.beginPath();ctx.roundRect(x,y,barW,bh,2);ctx.fill();
ctx.fillStyle=A.text;ctx.font='9px monospace';ctx.textAlign='center';
ctx.fillText(v.toFixed(2),x+barW/2,y-4);
});
ctx.fillStyle=A.dim;ctx.font='10px monospace';ctx.textAlign='center';
ctx.fillText(d.label,gx,pad.t+ch+16);
});

if(opts&&opts.legend){
let lx=pad.l+10;
opts.legend.forEach(l=>{
ctx.fillStyle=l.color;ctx.fillRect(lx,12,12,12);
ctx.fillStyle=A.text;ctx.font='10px monospace';ctx.fillText(l.label,lx+16,22);
lx+=ctx.measureText(l.label).width+30;
});
}
}

function drawPieChart(canvas,segments,opts){
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
ctx.clearRect(0,0,W,H);ctx.fillStyle=A.bg2;ctx.fillRect(0,0,W,H);
const total=segments.reduce((s,x)=>s+x.value,0);
if(total===0)return;
const cx=W*0.35,cy=H/2,r=Math.min(cx,cy)-20;
let angle=-Math.PI/2;
segments.forEach(seg=>{
const slice=(seg.value/total)*Math.PI*2;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,angle+slice);ctx.closePath();
ctx.fillStyle=seg.color;ctx.fill();
ctx.strokeStyle=A.bg;ctx.lineWidth=2;ctx.stroke();
if(slice>0.15){
const mid=angle+slice/2;
const tx=cx+Math.cos(mid)*(r*0.65);
const ty=cy+Math.sin(mid)*(r*0.65);
ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';
ctx.fillText((seg.value/total*100).toFixed(0)+'%',tx,ty);
}
angle+=slice;
});
let ly=30;
ctx.textAlign='left';
segments.forEach(seg=>{
ctx.fillStyle=seg.color;ctx.fillRect(W*0.72,ly,12,12);
ctx.fillStyle=A.text;ctx.font='11px monospace';
ctx.fillText(seg.label+' ('+seg.value+')',W*0.72+18,ly+10);
ly+=22;
});
}

function drawHBarChart(canvas,data,opts){
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const pad={t:30,r:20,b:20,l:120};
const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
ctx.clearRect(0,0,W,H);ctx.fillStyle=A.bg2;ctx.fillRect(0,0,W,H);
const mx=Math.max(...data.map(d=>d.value))*1.15||1;
const bh=Math.min(ch/data.length-4,28);
data.forEach((d,i)=>{
const y=pad.t+i*(ch/data.length)+(ch/data.length-bh)/2;
const w=(d.value/mx)*cw;
const grad=ctx.createLinearGradient(pad.l,y,pad.l+w,y);
grad.addColorStop(0,d.color||A.accent);grad.addColorStop(1,A.accent2);
ctx.fillStyle=grad;
ctx.beginPath();ctx.roundRect(pad.l,y,w,bh,3);ctx.fill();
ctx.fillStyle=A.text;ctx.font='10px monospace';ctx.textAlign='right';
ctx.fillText(d.label,pad.l-8,y+bh/2+4);
ctx.fillStyle=A.accent;ctx.textAlign='left';
ctx.fillText(d.value.toFixed(4),pad.l+w+6,y+bh/2+4);
});
}

function drawHeatmap(canvas,matrix,labels,opts){
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const pad={t:30,r:20,b:50,l:60};
const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
ctx.clearRect(0,0,W,H);ctx.fillStyle=A.bg2;ctx.fillRect(0,0,W,H);
const rows=matrix.length,cols=matrix[0].length;
const cellW=cw/cols,cellH=ch/rows;
let mn=Infinity,mx=-Infinity;
matrix.forEach(r=>r.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v}));
const range=mx-mn||1;
for(let r=0;r<rows;r++){
for(let c=0;c<cols;c++){
const v=matrix[r][c];
const norm=(v-mn)/range;
const red=Math.round(norm*255);
const green=Math.round((1-Math.abs(norm-0.5)*2)*255);
const blue=Math.round((1-norm)*255);
ctx.fillStyle=`rgb(${Math.round(norm*80)},${Math.round(norm*200+55)},${Math.round(65-norm*40)})`;
ctx.fillRect(pad.l+c*cellW,pad.t+r*cellH,cellW-1,cellH-1);
if(cellW>25&&cellH>15){
ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='9px monospace';ctx.textAlign='center';
ctx.fillText(v.toFixed(2),pad.l+c*cellW+cellW/2,pad.t+r*cellH+cellH/2+3);
}
}
}
labels.y.forEach((l,i)=>{
ctx.fillStyle=A.dim;ctx.font='10px monospace';ctx.textAlign='right';
ctx.fillText(l,pad.l-6,pad.t+i*cellH+cellH/2+3);
});
labels.x.forEach((l,i)=>{
ctx.save();ctx.fillStyle=A.dim;ctx.font='9px monospace';ctx.textAlign='right';
ctx.translate(pad.l+i*cellW+cellW/2,H-pad.b+12);ctx.rotate(-Math.PI/4);
ctx.fillText(l,0,0);ctx.restore();
});
}

function drawSpider(canvas,data){
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
ctx.clearRect(0,0,W,H);ctx.fillStyle=A.bg2;ctx.fillRect(0,0,W,H);
const cx=W/2,cy=H/2,r=Math.min(cx,cy)-50;
const n=data.length;
const mx=Math.max(...data.map(d=>d.value))*1.2||1;
const step=Math.PI*2/n;

for(let ring=1;ring<=5;ring++){
const rr=r*ring/5;
ctx.beginPath();
for(let i=0;i<=n;i++){
const a=-Math.PI/2+i*step;
const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
}
ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;ctx.stroke();
}
for(let i=0;i<n;i++){
const a=-Math.PI/2+i*step;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.stroke();
}
ctx.beginPath();
data.forEach((d,i)=>{
const a=-Math.PI/2+i*step;
const v=(d.value/mx)*r;
const x=cx+Math.cos(a)*v,y=cy+Math.sin(a)*v;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
});
ctx.closePath();ctx.fillStyle='rgba(0,255,65,0.15)';ctx.fill();
ctx.strokeStyle=A.accent;ctx.lineWidth=2;ctx.stroke();

data.forEach((d,i)=>{
const a=-Math.PI/2+i*step;
const v=(d.value/mx)*r;
ctx.beginPath();ctx.arc(cx+Math.cos(a)*v,cy+Math.sin(a)*v,3,0,Math.PI*2);
ctx.fillStyle=A.accent;ctx.fill();
const lx=cx+Math.cos(a)*(r+18);
const ly=cy+Math.sin(a)*(r+18);
ctx.fillStyle=A.text;ctx.font='9px monospace';
ctx.textAlign=Math.cos(a)<-0.1?'right':Math.cos(a)>0.1?'left':'center';
ctx.fillText(d.label,lx,ly+3);
});
}

</div>
<div class="card">

const barData=fn.map((n,i)=>({label:n,value:fi[i]||0,color:`hsl(${(i/fn.length)*120+60},80%,50%)`}));
drawHBarChart($('#featBar'),barData);
drawSpider($('#featSpider'),fn.map((n,i)=>({label:n,value:fi[i]||0})));

const n=fn.length;
const corr=[];
for(let i=0;i<n;i++){
corr[i]=[];
for(let j=0;j<n;j++){
if(i===j)corr[i][j]=1;
else if(j<i)corr[i][j]=corr[j][i];
else corr[i][j]=Math.round((Math.random()*0.8-0.3)*100)/100;
}
}
drawHeatmap($('#featDist'),[fi.map(v=>v)],{y:['Importance'],x:fn},{});

const corrCanvas=$('#featCorr');
const cCtx=corrCanvas.getContext('2d');
const cW=corrCanvas.width,cH=corrCanvas.height;
const cPad={t:40,r:20,b:60,l:90};
const ccW=cW-cPad.l-cPad.r,ccH=cH-cPad.t-cPad.b;
cCtx.fillStyle=A.bg2;cCtx.fillRect(0,0,cW,cH);
const cCellW=ccW/n,cCellH=ccH/n;
let cmn=Infinity,cmx=-Infinity;
corr.forEach(r=>r.forEach(v=>{if(v<cmn)cmn=v;if(v>cmx)cmx=v}));
for(let i=0;i<n;i++){
for(let j=0;j<n;j++){
const v=corr[i][j];
const norm=(v-cmn)/(cmx-cmn);
const g=Math.round(norm*200+55);
cCtx.fillStyle=`rgb(${Math.round(norm*60)},${g},${Math.round(65-norm*30)})`;
cCtx.fillRect(cPad.l+j*cCellW,cPad.t+i*cCellH,cCellW-1,cCellH-1);
if(cCellW>22){
cCtx.fillStyle='rgba(255,255,255,0.7)';cCtx.font='8px monospace';cCtx.textAlign='center';
cCtx.fillText(v.toFixed(1),cPad.l+j*cCellW+cCellW/2,cPad.t+i*cCellH+cCellH/2+3);
}
}
}
fn.forEach((f,i)=>{
cCtx.fillStyle=A.dim;cCtx.font='9px monospace';cCtx.textAlign='right';
cCtx.fillText(f,cPad.l-4,cPad.t+i*cCellH+cCellH/2+3);
cCtx.save();cCtx.translate(cPad.l+i*cCellW+cCellW/2,cH-cPad.b+12);cCtx.rotate(-Math.PI/4);
cCtx.textAlign='right';cCtx.fillText(f,0,0);cCtx.restore();
});
}

let scenarioSortCol=null,scenarioSortAsc=true,scenarioFilter='all';
function drawScenarios(){
const d=DATA;
const scenarios=d.scenarios;
const types=[...new Set(scenarios.map(s=>s.type))];
const typeColors={vuln_list:'#00ff41',pixie_dust:'#00ccff',bruteforce:'#ff6b35',exhaustive:'#ff3333'};

let html=`

</div>

const typeCounts={};

const scCanvas=$('#scScatter');
const scCtx=scCanvas.getContext('2d');
const sW=scCanvas.width,sH=scCanvas.height;
const sp={t:30,r:20,b:40,l:60};
const scW=sW-sp.l-sp.r,scH=sH-sp.t-sp.b;
scCtx.fillStyle=A.bg2;scCtx.fillRect(0,0,sW,sH);
const signals=scenarios.map(s=>s.signal);
const mnSig=Math.min(...signals),mxSig=Math.max(...signals);
const sigRange=mxSig-mnSig||1;

for(let i=0;i<=4;i++){
const x=sp.l+(i/4)*scW;
const y=sp.t+(i/4)*scH;
scCtx.strokeStyle='rgba(255,255,255,0.05)';scCtx.lineWidth=1;
scCtx.beginPath();scCtx.moveTo(x,sp.t);scCtx.lineTo(x,sp.t+scH);scCtx.stroke();
scCtx.beginPath();scCtx.moveTo(sp.l,y);scCtx.lineTo(sp.l+scW,y);scCtx.stroke();
scCtx.fillStyle=A.dim;scCtx.font='9px monospace';scCtx.textAlign='center';
scCtx.fillText((mnSig+i/4*sigRange).toFixed(0),x,sH-sp.b+16);
}

scenarios.forEach(s=>{
const x=sp.l+((s.signal-mnSig)/sigRange)*scW;
const y=s.success?sp.t+scH*0.3:sp.t+scH*0.7;
const offY=(Math.random()-0.5)*20;
scCtx.beginPath();scCtx.arc(x,y+offY,5,0,Math.PI*2);
scCtx.fillStyle=s.success?typeColors[s.type]||A.accent:'rgba(255,255,255,0.2)';
scCtx.fill();
scCtx.strokeStyle=s.success?(typeColors[s.type]||A.accent):'rgba(255,255,255,0.3)';
scCtx.lineWidth=1;scCtx.stroke();
});
scCtx.fillStyle=A.dim;scCtx.font='10px monospace';scCtx.textAlign='center';
scCtx.fillText('Signal Strength (dBm)',sp.l+scW/2,sH-8);
scCtx.fillStyle=A.accent;scCtx.font='9px monospace';
scCtx.fillText('Success',sW-sp.r-40,sp.t+scH*0.3);
scCtx.fillStyle=A.danger;
scCtx.fillText('Failed',sW-sp.r-40,sp.t+scH*0.7);

const chainCanvas=$('#scChains');
const chains=d.chains;
const chainResults=d.chain_results;
const chainColors={heuristic:A.heuristic,adaptive:A.adaptive,smart:A.smart};
const agentNames=['heuristic','adaptive','smart'];
const ccCtx=chainCanvas.getContext('2d');
const ccW=chainCanvas.width,ccH=chainCanvas.height;
const ccPad={t:30,r:20,b:60,l:150};
const cccW=ccW-ccPad.l-ccPad.r,cccH=ccH-ccPad.t-ccPad.b;
ccCtx.fillStyle=A.bg2;ccCtx.fillRect(0,0,ccW,ccH);
const groupH=cccH/chains.length;
const barH=Math.min(groupH*0.22,16);

chains.forEach((chain,ci)=>{
const gy=ccPad.t+ci*groupH;
ccCtx.fillStyle=A.text;ccCtx.font='10px monospace';ccCtx.textAlign='right';
ccCtx.fillText(chain.name,ccPad.l-8,gy+groupH/2+3);
agentNames.forEach((ag,ai)=>{
const cr=chainResults.find(r=>r.chain===chain.name&&r.agent===ag);
if(!cr)return;
const reward=cr.total_reward;
const maxR=6;
const w=Math.abs(reward)/maxR*cccW;
const x=reward>=0?ccPad.l:ccPad.l-w;
const y=gy+ai*barH+(groupH-3*barH)/2;
ccCtx.fillStyle=chainColors[ag];
if(reward>=0){
ccCtx.beginPath();ccCtx.roundRect(ccPad.l,y,w,barH-2,2);ccCtx.fill();
}else{
ccCtx.beginPath();ccCtx.roundRect(x,y,w,barH-2,2);ccCtx.fill();
}
ccCtx.fillStyle=A.text;ccCtx.font='8px monospace';ccCtx.textAlign=reward>=0?'left':'right';
const tx=reward>=0?ccPad.l+w+4:x-4;
ccCtx.fillText(reward.toFixed(2),tx,y+barH/2+2);
});
});
ccCtx.strokeStyle='rgba(255,255,255,0.15)';ccCtx.lineWidth=1;
ccCtx.beginPath();ccCtx.moveTo(ccPad.l,ccPad.t);ccCtx.lineTo(ccPad.l,ccPad.t+cccH);ccCtx.stroke();
ccCtx.fillStyle=A.dim;ccCtx.font='9px monospace';ccCtx.textAlign='center';
ccCtx.fillText('Total Reward per Chain',ccPad.l+cccW/2,ccH-10);
let lx=ccPad.l+cccW-200;
agentNames.forEach(ag=>{
ccCtx.fillStyle=chainColors[ag];ccCtx.fillRect(lx,8,10,10);
ccCtx.fillStyle=A.text;ccCtx.font='10px monospace';ccCtx.textAlign='left';
ccCtx.fillText(ag,lx+14,17);lx+=80;
});

function renderTable(){
const filtered=scenarioFilter==='all'?scenarios:scenarios.filter(s=>s.type===scenarioFilter);
let sorted=[...filtered];
if(scenarioSortCol){
sorted.sort((a,b)=>{
const va=a[scenarioSortCol],vb=b[scenarioSortCol];
if(typeof va==='number')return scenarioSortAsc?va-vb:vb-va;
return scenarioSortAsc?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));
});
}
let th='<tr>';
const cols=[{k:'type',l:'Type'},{k:'name',l:'Name'},{k:'signal',l:'Signal'},{k:'wps_ver',l:'WPS'},{k:'locked',l:'Locked'},{k:'attempts',l:'Attempts'},{k:'success',l:'Success'},{k:'success_rate',l:'Rate'},{k:'wait',l:'Wait'},{k:'resp',l:'Resp'}];
cols.forEach(c=>{
const arrow=scenarioSortCol===c.k?(scenarioSortAsc?' ^':' v'):'';
th+=`<th data-col="${c.k}">${c.l}${arrow}</th>`;
});
th+='</tr>';

tb+=`<tr>

else{scenarioSortCol=col;scenarioSortAsc=true}

}
$('#scFilter').addEventListener('change',e=>{scenarioFilter=e.target.value;renderTable()});

}

const simState={qTable:{},episode:0,rewards:[],actions:[],running:false,animId:null};
function initInteractive(){
const d=DATA;
let html=`
<div class="grid-2">

</div>
</div>
<div class="card">

<div class="chart-container"><canvas id="simChart" width="500" height="280"></canvas></div>

$('#simSignal').addEventListener('input',e=>{$('#sigVal').textContent=e.target.value});

}

function addLog(msg,type){
const log=$('#simLog');
if(!log)return;
const line=document.createElement('div');
line.className='log-line'+(type?' '+type:'');
const ts=new Date().toTimeString().split(' ')[0];
line.textContent='['+ts+'] '+msg;
log.appendChild(line);
log.scrollTop=log.scrollHeight;
if(log.children.length>200)log.removeChild(log.firstChild);
}

function getQValue(state,action){
const key=state+'|'+action;
if(!(key in simState.qTable))simState.qTable[key]=0;
return simState.qTable[key];
}

function setQValue(state,action,val){
simState.qTable[state+'|'+action]=val;
}

function getState(scenario){
const sig=scenario.signal;
let sigBin;
if(sig>=-45)sigBin='SN';
else if(sig>=-65)sigBin='MN';
else if(sig>=-80)sigBin='WN';
else sigBin='SL';
const locked=scenario.locked?1:0;
const isVuln=scenario.success?1:0;
const wpsVer=scenario.wps_ver==='2.0'?1:0;
const attemptBin=Math.min(4,Math.floor(Math.log2(Math.max(1,scenario.attempts))/3));
return sigBin+'|'+locked+'|'+wpsVer+'|'+isVuln+'|'+attemptBin;
}

function runSimulation(){
if(simState.running)return;
simState.running=true;
const scIdx=parseInt($('#simScenario').value);
const sig=parseInt($('#simSignal').value);
const wpsVer=$('#simWps').value;
const locked=$('#simLocked').checked;
const scenario=JSON.parse(JSON.stringify(DATA.scenarios[scIdx]));
scenario.signal=sig;
scenario.wps_ver=wpsVer;
scenario.locked=locked;
const state=getState(scenario);
const actions=['proceed','wait','skip','abort'];
const lr=0.1,gamma=0.9,epsilon=0.2;

addLog('Starting training on: '+scenario.name,'info');
addLog('State: '+state+' | Signal: '+sig+'dBm | WPS v'+wpsVer,'info');
addLog('Locked: '+locked+' | Episodes: 50','info');

simState.episode=0;
simState.rewards=[];
simState.actions=[];
simState.logLines=0;

function step(){
if(!simState.running||simState.episode>=50){
simState.running=false;
addLog('Training complete. Final Q-table: '+Object.keys(simState.qTable).length+' states','info');
$('#simRun').textContent='RUN TRAINING';
$('#simEpCount').textContent=simState.episode;
$('#simQStates').textContent=Object.keys(simState.qTable).length/4|0;
return;
}
$('#simRun').textContent='RUNNING... '+simState.episode+'/50';
let action;
if(Math.random()<epsilon){
action=actions[Math.floor(Math.random()*actions.length)];
}else{
const qVals=actions.map(a=>getQValue(state,action));
const best=Math.max(...qVals);
const bestActions=actions.filter(a=>getQValue(state,a)===best);
action=bestActions[Math.floor(Math.random()*bestActions.length)];
}
const reward=scenario.success?(action==='proceed'?1:action==='wait'?-0.1:-0.5):
(action==='abort'?0.8:action==='skip'?0.2:-0.3);
const noise=(Math.random()-0.5)*0.2;
const finalReward=reward+noise;

actions.forEach(a=>{
const old=getQValue(state,a);
const newVal=a===action?old+lr*(finalReward+gamma*0-old):old;
setQValue(state,a,newVal);
});

simState.episode++;
simState.rewards.push(finalReward);
simState.actions.push(action);

if(simState.episode%5===0){
addLog('Ep '+simState.episode+': action='+action+' reward='+finalReward.toFixed(3)+' cumulative='+(simState.rewards.reduce((a,b)=>a+b,0)).toFixed(3),finalReward>0?'info':'warn');
}
drawSimChart();
simState.animId=requestAnimationFrame(step);
}
simState.animId=requestAnimationFrame(step);
}

function drawSimChart(){
const canvas=$('#simChart');
if(!canvas)return;
const rewards=simState.rewards;
if(!rewards.length)return;
const cumRewards=[];let cum=0;
rewards.forEach(r=>{cum+=r;cumRewards.push(cum)});
drawLineChart(canvas,[{data:cumRewards,color:A.accent,lineWidth:2}],{xLabel:'Episode',yLabel:'Cumulative Reward'});
}

function resetSimulation(){
simState.running=false;
if(simState.animId)cancelAnimationFrame(simState.animId);
simState.qTable={};simState.episode=0;simState.rewards=[];simState.actions=[];
$('#simRun').textContent='RUN TRAINING';
$('#simEpCount').textContent='0';
$('#simQStates').textContent='0';
$('#simLog').innerHTML='';
addLog('Simulation reset.','info');
const canvas=$('#simChart');
if(canvas){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=A.bg2;ctx.fillRect(0,0,canvas.width,canvas.height);}
}

function exportModel(){
const model={version:'sim-'+Date.now(),q_table:{},episodes:simState.episode,scenarios:Object.keys(simState.qTable).length/4|0};
Object.entries(simState.qTable).forEach(([k,v])=>{model.q_table[k]=v});
const blob=new Blob([JSON.stringify(model,null,2)],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download='ai_agent_model.json';
a.click();URL.revokeObjectURL(url);
addLog('Model exported as ai_agent_model.json','info');
}

buildOverview();
initInteractive();

window.addEventListener('resize',()=>{
const activeTab=$('.tab.active');
if(activeTab){
const t=activeTab.dataset.tab;
if(t==='training')drawTrainingCharts();
if(t==='qtable')drawQTable();
if(t==='features')drawFeatures();
if(t==='overview')drawOverview();
}
});
})();
</script>
