name: Nightly Community Model Build

on:
  schedule:
    # Every 3 days at 00:00 UTC (plan: periodic rebuild)
    - cron: '0 0 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --break-system-packages scikit-learn joblib numpy

      - name: Build golden community model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python model_build.py

      - name: Commit & push model
        run: |
          git config user.name "OPX Community Bot"
          git config user.email "bot@opxoneshot.local"
          git add models/
          if git diff --cached --quiet; then
            echo "No model changes to publish"
          else
            git commit -m "training: nightly community model rebuild ($(date -u +%Y-%m-%d))"
            git push origin HEAD
          fi
