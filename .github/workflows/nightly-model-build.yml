name: Nightly Community Model Build

on:
  schedule:
    # Every 3 days at 00:00 UTC (plan: periodic rebuild)
    - cron: '0 0 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --break-system-packages scikit-learn joblib numpy

      - name: Build golden community model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python model_build.py

      - name: Publish model to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="model-$(date -u +%Y%m%d-%H%M%S)"
          # Create release with model files as assets
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "AI Brain Model $TAG" \
            --notes "Auto-trained community model ($(date -u +%Y-%m-%d)) | $(wc -c < models/ai_agent.joblib) bytes | cross-val: $(python -c "import json; print(json.load(open('models/model_metadata.json')).get('cross_val_accuracy','?'))")" \
            models/ai_agent.joblib \
            models/model_metadata.json
          # Delete old releases beyond last 5 to save storage
          RELEASES=$(gh release list --repo "${{ github.repository }}" --limit 50 | grep '^model-' | tail -n +6 | awk '{print $1}')
          for OLD in $RELEASES; do
            gh release delete "$OLD" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          done
